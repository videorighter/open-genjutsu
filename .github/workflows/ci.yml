name: Validate service and release contracts

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: npm ci
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python scripts/release.py check
      - run: python -m unittest discover -s tests/release -v
      - run: ruff check backend && ruff check scripts --config backend/ruff.toml
      - run: npm test && npm run build
      - run: PYTHONPATH=backend pytest backend/tests -m 'not integration'
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: npm ci && python -m pip install -r backend/requirements-dev.txt
      - run: npx playwright install --with-deps chromium
      - name: Start disposable stack
        run: |
          python scripts/configure.py
          docker compose up -d --build --wait --wait-timeout 180
      - name: Temporal integration and replay
        run: |
          temporal_host=$(docker inspect open-genjutsu-temporal-1 --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}')
          GENJUTSU_TEST_TEMPORAL_ADDRESS="$temporal_host:7233" NO_PROXY='*' no_proxy='*' PYTHONPATH=backend pytest backend/tests/test_temporal.py -q
      - name: Compose recovery
        run: GENJUTSU_TEST_COMPOSE_STACK=1 PYTHONPATH=backend pytest backend/tests/test_compose_recovery.py -q
      - name: Service desktop and mobile browser tests
        run: npm run test:service
      - name: Stop disposable stack
        if: always()
        run: docker compose down --volumes
